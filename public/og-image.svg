<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1931"/>
      <stop offset="50%" stop-color="#10254C"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B838"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle circles/mesh -->
  <circle cx="1050" cy="150" r="300" fill="#1E3A8A" opacity="0.3"/>
  <circle cx="200" cy="550" r="250" fill="#F5B838" opacity="0.08"/>

  <!-- Tag badge -->
  <rect x="80" y="80" width="440" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="104" y="108" font-family="sans-serif" font-size="16" font-weight="700" fill="#F5B838" letter-spacing="1.5">
    VĂN BẰNG 2 • GÓC NHÌN TRUYỀN THÔNG NĂM 3
  </text>

  <!-- Main Headline -->
  <text x="80" y="220" font-family="sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">
    Văn bằng 2 Truyền thông —
  </text>
  <text x="80" y="285" font-family="sans-serif" font-size="52" font-weight="800" fill="url(#accent)">
    mở rộng kỹ năng, mở thêm lựa chọn.
  </text>

  <!-- Subtitle -->
  <text x="80" y="360" font-family="sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">
    Chia sẻ những trải nghiệm thực tế từ sinh viên năm 3: từ xây dựng nội dung,
  </text>
  <text x="80" y="395" font-family="sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">
    thiết kế hình ảnh đến teamwork trong ngành Truyền thông Đa phương tiện.
  </text>

  <!-- Footer Brand -->
  <rect x="80" y="475" width="64" height="64" rx="16" fill="#F5B838"/>
  <text x="100" y="515" font-family="sans-serif" font-size="30" font-weight="900" fill="#0A1931">LHU</text>
  <text x="165" y="500" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">ĐẠI HỌC LẠC HỒNG</text>
  <text x="165" y="528" font-family="sans-serif" font-size="16" font-weight="500" fill="#94A3B8">CHUYỆN TỤI MÌNH • Dự án nội dung sinh viên</text>
</svg>
