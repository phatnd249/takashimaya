<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy trang | Chuyện Tụi Mình LHU</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      --color-primary: #0A1931;
      --color-accent: #F5B838;
      --color-accent-hover: #E5A827;
      --color-bg: #F8FAFC;
      --color-text: #0F172A;
      --color-text-muted: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .error-card {
      background: #FFFFFF;
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(10, 25, 49, 0.08);
      max-width: 480px;
      width: 100%;
      border: 1px solid #E2E8F0;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      background: rgba(245, 184, 56, 0.15);
      color: #B45309;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    p {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.75rem;
      background: var(--color-accent);
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(245, 184, 56, 0.35);
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="badge">404 NOT FOUND</div>
    <h1>404</h1>
    <h2>Trang không tồn tại</h2>
    <p>Trang bạn đang tìm kiếm có thể đã bị di chuyển hoặc không khả dụng. Hãy quay lại trang chủ để khám phá tiếp câu chuyện của tụi mình.</p>
    <a href="./" class="btn-home">← Quay về Trang chủ</a>
  </div>
</body>
</html>
